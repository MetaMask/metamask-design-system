name: Figma Code Connect

on:
  workflow_call:
    inputs:
      publish:
        description: 'Publish Code Connect mappings to Figma (true on main push, false on PR dry-run)'
        required: true
        type: boolean
    secrets:
      FIGMA_ACCESS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  figma-code-connect:
    name: ${{ inputs.publish && 'Publish Code Connect' || 'Validate Code Connect' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26.x]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@392abd40aa6a0600a3c0ef4af75851662587e6ec # v1.4.0
        with:
          is-high-risk-environment: ${{ inputs.publish }}

      # TOKEN is temporarily exempt from the banned environment variable names
      # in lavamoat/.env.ban.json so that the Figma CLI can read
      # FIGMA_ACCESS_TOKEN directly from the environment. Re-ban TOKEN once
      # harden supports per-script overrides of the banned list.
      - name: Dry run Code Connect publish
        if: ${{ !inputs.publish }}
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: yarn figma:connect:publish:dry-run

      - name: Publish Code Connect to Figma
        if: ${{ inputs.publish }}
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: yarn figma:connect:publish

      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi
