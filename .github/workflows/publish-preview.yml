name: Publish a preview build

on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: 'Pull request number to publish a preview build for. Mutually exclusive with "branch".'
        required: false
        type: number
      branch:
        description: 'Branch in this repository to publish a preview build for. Mutually exclusive with "pull-request".'
        required: false
        type: string
        default: ''
      packages:
        description: 'Comma-separated list of packages to publish, e.g., "@metamask/design-system-react, design-tokens". Mutually exclusive with "only-changed-packages". Leave empty to publish all packages.'
        required: false
        type: string
        default: ''
      only-changed-packages:
        description: 'Only publish packages changed compared to the base branch. Mutually exclusive with "packages".'
        required: false
        type: boolean
        default: true
      dry-run:
        description: 'Perform a dry run.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  publish-preview:
    name: Publish preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: MetaMask/github-tools/.github/workflows/publish-preview-oidc.yml@c0006fff89d70f7b1063d47cabb7ab09b3782ba3 # v1
    with:
      pull-request: ${{ fromJSON(inputs.pull-request || '0') }}
      branch: ${{ inputs.branch }}
      packages: ${{ inputs.packages }}
      only-changed-packages: ${{ inputs.only-changed-packages }}
      dry-run: ${{ inputs.dry-run }}
      environment: npm-preview
      docs-url: 'https://github.com/MetaMask/metamask-design-system/blob/main/docs/contributing.md#testing-changes-to-packages-with-preview-builds'
      # The shared rename step only adds `name@^version` resolutions, which do
      # not match this repo's `workspace:^` dependencies. Build first so that
      # prepare-preview-builds rewrites them to `@metamask-previews/*@workspace:*`
      # before the shared rename and its `yarn install` run.
      rename-after-install-and-build: true
      build-command: 'yarn prepare-preview-builds @metamask-previews "$(git rev-parse --short HEAD)" && yarn build'
