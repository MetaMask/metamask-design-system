name: Publish a preview build

on:
  issue_comment:
    types: created

permissions:
  contents: read

jobs:
  publish-preview:
    name: Publish build preview
    permissions:
      contents: read
      pull-requests: write
    # issue_comment runs with repository secrets. The shared workflow builds
    # the pull request without the NPM token, then publishes sanitized
    # artifacts in a separate job. prepare-preview-builds still rewrites
    # in-repo imports to the preview scope before that build.
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '@metamaskbot publish-preview') }}
    uses: MetaMask/github-tools/.github/workflows/publish-preview.yml@5d993ac935eff3f248d2213bb2d6922ce9cb3510 # v1
    with:
      docs-url: 'https://github.com/MetaMask/metamask-design-system/blob/main/docs/contributing.md#testing-changes-to-packages-with-preview-builds'
      build-command: 'yarn prepare-preview-builds @metamask-previews "$(git rev-parse --short HEAD)" && yarn build'
    secrets:
      PUBLISH_PREVIEW_NPM_TOKEN: ${{ secrets.PUBLISH_PREVIEW_NPM_TOKEN }}
