name: Publish a preview build

on:
  issue_comment:
    types: created

permissions:
  contents: read

jobs:
  publish-preview:
    name: Publish build preview
    permissions:
      contents: read
      pull-requests: write
    # issue_comment runs with repository secrets. The shared workflow builds
    # the pull request without the NPM token, then publishes sanitized
    # artifacts in a separate job.
    #
    # Its prepare step renames public packages to @metamask-previews and then
    # runs `yarn install`. The portal resolutions it adds only match semver
    # descriptors (`name@^version`), not this repo's `workspace:^` ranges, so
    # that install fails with "Workspace not found".
    # scripts/plugin-preview-workspace-fallback.cjs links those descriptors
    # at the renamed checkout so the install can finish.
    # `prepare-preview-builds` then rewrites names, workspace ranges, and
    # source imports, and must stay in the post-rename build so the published
    # version keeps the `preview.<sha>` form from that script.
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '@metamaskbot publish-preview') }}
    uses: MetaMask/github-tools/.github/workflows/publish-preview.yml@5d993ac935eff3f248d2213bb2d6922ce9cb3510 # v1
    with:
      docs-url: 'https://github.com/MetaMask/metamask-design-system/blob/main/docs/contributing.md#testing-changes-to-packages-with-preview-builds'
      # Keep false. The shared workflow's own rename uses `preview-<sha>`
      # (hyphen). Running prepare-preview-builds afterwards restores
      # `preview.<sha>` and rewrites workspace dependencies before publish.
      rename-after-install-and-build: false
      build-command: 'yarn prepare-preview-builds @metamask-previews "$(git rev-parse --short HEAD)" && yarn build'
    secrets:
      PUBLISH_PREVIEW_NPM_TOKEN: ${{ secrets.PUBLISH_PREVIEW_NPM_TOKEN }}
